<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tilted staple variations</title>
<style>
:root { --bg:#f4f1ea; --card:#fff; --ink:#1b1a17; --muted:#6b675f; --rule:#e2ddd2; }
@media (prefers-color-scheme: dark) { :root { --bg:#161513; --card:#211f1c; --ink:#ece8df; --muted:#a19b8f; --rule:#34312c; } }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif; }
main { max-width:1080px; margin:0 auto; padding:32px 16px 64px; }
h1 { font:700 28px/1.2 Charter,Georgia,serif; margin:0 0 4px; } p.lede { color:var(--muted); margin:0 0 24px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
.v { margin:0; background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.v > img { width:180px; height:180px; }
figcaption { text-align:center; } figcaption b { display:block; } figcaption span { color:var(--muted); font-size:13px; }
.mini { display:flex; gap:6px; } .mini img { width:44px; height:44px; }
.bars { display:flex; gap:8px; }
.bar { display:flex; align-items:center; gap:8px; padding:5px 10px; border-radius:7px; }
.bar.light { background:#dee1e6; color:#333; } .bar.dark { background:#35363a; color:#ddd; }
.bar img { width:16px; height:16px; } .bar i { width:16px; height:16px; border-radius:50%; background:currentColor; opacity:.25; }
</style></head><body><main>
<h1>Tilted staple — variations</h1>
<p class="lede">Angles, proportions and weight. Each card shows the icon large, between Plainview and Quoth, and at real 16&nbsp;px toolbar size.</p>
